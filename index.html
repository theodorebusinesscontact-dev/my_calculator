<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="wrapper">
        <section class="result">
            0
        </section>

        <section class="cbuttons">
            <div class="row">
                <button class="cbuttondouble">
                    C
                </button>
                <button class="cbutton">
                    &larr;
                </button>
                <button class="cbutton">
                    &divide;
                </button>
            </div>
            <div class="row">
                <button class="cbutton">
                    7
                </button>
                <button class="cbutton">
                    8
                </button>
                <button class="cbutton">
                    9
                </button>
                <button class="cbutton">
                    &times;
                </button>
            </div>
            <div class="row">
                <button class="cbutton">
                    4
                </button>
                <button class="cbutton">
                    5
                </button>
                <button class="cbutton">
                    6
                </button>
                <button class="cbutton">
                    &minus;
                </button>
            </div>
            <div class="row">
                <button class="cbutton">
                    1
                </button>
                <button class="cbutton">
                    2
                </button>
                <button class="cbutton">
                    3
                </button>
                <button class="cbutton">
                    &plus;
                </button>
            </div>

            <div class="row">
                <button class="cbuttontriple">
                    0
                </button>
                <button class="cbutton">
                    &equals;
                </button>
            </div>

        </section>
    </div>


<script src="script.js"></script>
</body>
</html>
